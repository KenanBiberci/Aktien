# =============================================================================
# config.yaml — zentrale Annahmen der S&P-500-Valuation-Pipeline
# Alle Hebel hier anpassbar, ohne Code zu ändern (keine Magic Numbers im Code).
# =============================================================================

# --- Kapitalmarkt-Annahmen ---------------------------------------------------
risk_free_rate: 0.043       # 10y-Treasury-Näherung
equity_risk_premium: 0.05   # Marktrisikoprämie (für CAPM)
terminal_growth: 0.03       # g (langfristiges Wachstum)
stage1_years: 5             # N für 2-Stufen-DDM
ddm_payout_gate: 0.25       # DDM-Methoden (M1-M3) nur wenn Payout >= diesem Wert
default_tax: 0.21           # Steuersatz (für WACC after-tax Fremdkapitalkosten)

# --- Signal-Schwellen (Ø-Upside) ---------------------------------------------
signal_thresholds:
  strong_buy: 0.30          # ab hier STRONG BUY (zusätzlich n_methods >= 3)
  buy: 0.10                 # ab hier BUY
  hold_floor: -0.10         # darunter = REDUCE

# --- Globale Fallback-Multiplikatoren (nur falls Sektor-Median fehlt) --------
fallback_multiples:
  pe: 18
  ps: 3
  pb: 3
  ev_ebitda: 12

# --- Währung -----------------------------------------------------------------
# Die Rohdaten (US-Aktien) kommen in USD. Alle Geldbeträge in der Ausgabe werden
# nach EUR umgerechnet. Der Kurs wird live geholt (yfinance EURUSD=X);
# schlägt das fehl, greift der Fallback (USD je 1 EUR).
currency:
  target: EUR
  fallback_eurusd: 1.08     # 1 EUR = 1.08 USD (Näherung, falls Live-Kurs fehlt)
  # Fallback-Wechselkurse als "Fremdwährung je 1 EUR" (nur falls Live-Kurs fehlt).
  # London (.L) notiert in Pence (GBp) -> intern GBP*100.
  fallback_rates:
    USD: 1.08
    GBP: 0.84
    CHF: 0.94
    DKK: 7.46
    SEK: 11.30
    NOK: 11.70

# --- Peer-Multiplikatoren ----------------------------------------------------
peer:
  level: sub_industry          # Peer-Median auf GICS Sub-Industry statt Sektor
  min_peers: 5                 # weniger Peers -> Fallback auf Sektor, dann global

# --- Methoden-Eignung --------------------------------------------------------
method_eligibility:
  require_positive_equity: [pb, asset]   # P/B & Asset-based nur wenn Eigenkapital > 0
  ps_margin_adjust: true       # P/S margen-adjustiert statt roh
  ps_skip_if_margin_nonpositive: true

# --- DCF (M8): 2-Stufen statt Perpetuität ------------------------------------
dcf:
  mode: two_stage
  explicit_years: 10
  stage1_growth_cap: 0.12      # FCFF-Wachstum Stufe 1 aus Historie, hart gedeckelt
  terminal_growth_max: 0.025
  min_wacc_minus_g: 0.04       # erzwungener Mindestabstand WACC - g

# --- Ausreißer-Kappung + Trimmen ---------------------------------------------
clamp:
  lower_x: 0.3                 # Methodenwerte außerhalb [0.3*Kurs, 3*Kurs] = Ausreißer
  upper_x: 3.0
trim:
  method: pct                  # pct | iqr
  pct_band: 0.5                # nur Methoden innerhalb ±50 % des Medians behalten
  min_keep: 2                  # nie unter 2 Methoden trimmen

# --- Konfidenz + Signal-Gate -------------------------------------------------
confidence:
  divergence_high_conf: 0.35   # <= das -> Konfidenz hoch
  divergence_low_conf: 0.75    # >= das -> Konfidenz niedrig
  block_strong_buy_above: 0.60 # Divergenz darüber -> max. "BUY", nie STRONG BUY
  min_methods_high_conf: 4

# --- Backtest ----------------------------------------------------------------
# Historische 12-Monats-Renditen (jahresweise) über so viele Jahre zurück.
backtest:
  years: 20

# --- Datenabruf --------------------------------------------------------------
fetch:
  sleep_between_calls: 0.4  # Sekunden zwischen yfinance-Calls (Rate-Limit)
  max_retries: 3            # Retries mit Backoff bei fehlgeschlagenem Call
  backoff_base: 1.5         # Backoff-Basis (Sekunden): base * 2**versuch
